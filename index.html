<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 동물상 테스트 V2</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#fff8f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#222}
.wrap{max-width:760px;margin:auto;padding:28px 16px 56px}
.hero{text-align:center}.hero .emoji{font-size:46px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff0e8;color:#a45434;font-size:12px;font-weight:800}
.card{background:#fff;border-radius:24px;padding:22px;margin-top:18px;box-shadow:0 16px 48px rgba(90,55,30,.10)}
.drop{min-height:250px;border:2px dashed #edc5b0;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fffaf7}
.drop img{display:none;max-width:100%;max-height:440px;object-fit:contain}.placeholder{text-align:center;padding:28px}
input[type=file]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button,.file-label{border:0;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;flex:1;min-width:140px;text-align:center}
.primary,.file-label{background:linear-gradient(135deg,#ff8f66,#ffb36b);color:#fff}.secondary{background:#f5f1ed}
button:disabled{opacity:.5}.status{margin-top:13px;color:#666;font-size:14px}.loader{display:none;text-align:center;padding:12px}
#result{display:none;text-align:center}.animal-icon{font-size:72px}.result-name{font-size:30px;font-weight:900;margin:12px 0 5px}.result-score{color:#ff8f66;font-size:18px;font-weight:800}
.desc{line-height:1.75;color:#554a44}.bars{text-align:left;margin-top:22px}.bar-row{display:grid;grid-template-columns:92px 1fr 48px;gap:10px;align-items:center;margin:11px 0}
.track{height:10px;background:#f1ebe7;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff8f66,#ffb36b)}
.pct{text-align:right;font-size:13px}.notice{margin-top:18px;padding:14px;border-radius:14px;background:#faf5f1;font-size:13px;line-height:1.65}
@media(max-width:520px){.card{padding:17px}.bar-row{grid-template-columns:82px 1fr 44px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="emoji">🐶🐱🦊</div>
<h1>나의 동물상 테스트</h1>
<p>얼굴 랜드마크의 여러 비율을 비교해 재미용 동물상 결과를 보여드려요.</p>
<span class="badge">V2 · 곰상 쏠림 개선</span>
</section>

<section class="card">
<div id="drop" class="drop">
<div id="placeholder" class="placeholder">📷<br><b>얼굴 사진을 선택해 주세요</b><br>정면 사진 · 한 명만 나온 사진이 가장 좋습니다.</div>
<img id="preview" alt="미리보기">
</div>
<input id="file" type="file" accept="image/*">
<div class="actions">
<label class="file-label" for="file">사진 선택하기</label>
<button id="analyze" class="primary" disabled>동물상 분석하기</button>
<button id="reset" class="secondary">다시 선택</button>
</div>
<div id="status" class="status">사진은 서버에 저장하지 않고 브라우저에서만 처리합니다.</div>
<div id="loader" class="loader">분석 중...</div>
</section>

<section id="result" class="card">
<div id="animalIcon" class="animal-icon">🐶</div>
<div id="resultName" class="result-name">강아지상</div>
<div id="resultScore" class="result-score">상대 점수 0%</div>
<p id="resultDesc" class="desc"></p>
<div id="bars" class="bars"></div>
<div class="actions">
<button id="share" class="primary">결과 공유하기</button>
<button id="again" class="secondary">다시 테스트</button>
</div>
<div class="notice">※ 오락용 테스트입니다. 성격·능력·건강 등을 판단하지 않습니다.</div>
</section>
</main>

<script>
(() => {
const $=id=>document.getElementById(id);
const file=$("file"),preview=$("preview"),placeholder=$("placeholder"),analyze=$("analyze"),result=$("result"),status=$("status"),loader=$("loader");
let objectUrl=null,latestResults=null;

const animals=[
{name:"강아지상",icon:"🐶",p:[.58,.48,.52,.58,.48,.46,.48,.46],d:"부드럽고 친근한 인상이 두드러지는 타입이에요."},
{name:"고양이상",icon:"🐱",p:[.48,.56,.48,.40,.42,.42,.74,.48],d:"또렷하고 세련된 인상이 두드러지는 타입이에요."},
{name:"여우상",icon:"🦊",p:[.36,.48,.42,.34,.38,.40,.86,.38],d:"날렵하고 선명한 인상이 두드러지는 타입이에요."},
{name:"토끼상",icon:"🐰",p:[.46,.72,.44,.44,.42,.40,.54,.42],d:"밝고 생기 있는 인상이 두드러지는 타입이에요."},
{name:"곰상",icon:"🐻",p:[.80,.36,.50,.84,.58,.56,.38,.72],d:"편안하고 안정적인 인상이 두드러지는 타입이에요."},
{name:"사슴상",icon:"🦌",p:[.34,.64,.54,.38,.36,.38,.50,.34],d:"차분하고 맑은 인상이 두드러지는 타입이에요."},
{name:"햄스터상",icon:"🐹",p:[.84,.62,.48,.68,.64,.58,.44,.78],d:"둥글고 귀여운 인상이 두드러지는 타입이에요."}
];

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=(v,min,max)=>clamp((v-min)/(max-min));

file.addEventListener("change",e=>{
 const f=e.target.files[0]; if(!f)return;
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(f);
 preview.onload=()=>{preview.style.display="block";placeholder.style.display="none";analyze.disabled=false;result.style.display="none";};
 preview.src=objectUrl;
});

function resetAll(){
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=null;file.value="";preview.removeAttribute("src");preview.style.display="none";placeholder.style.display="block";analyze.disabled=true;result.style.display="none";
}
$("reset").onclick=resetAll;$("again").onclick=resetAll;

const faceMesh=new FaceMesh({locateFile:n=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${n}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.55});
faceMesh.onResults(r=>latestResults=r);

function features(lm){
 const top=lm[10],chin=lm[152],left=lm[234],right=lm[454];
 const faceH=dist(top,chin),faceW=dist(left,right);
 const eyeW=(dist(lm[33],lm[133])+dist(lm[362],lm[263]))/2;
 const eyeGap=dist(lm[133],lm[362]);
 const jawW=dist(lm[172],lm[397]);
 const mouthW=dist(lm[61],lm[291]);
 const noseW=dist(lm[98],lm[327]);
 const tilt=((lm[133].y-lm[33].y)+(lm[362].y-lm[263].y))/2/(faceH||1);
 const cheekW=dist(lm[50],lm[280]);
 return [
   norm(faceW/(faceH||1),.66,.90),
   norm(eyeW/(faceW||1),.17,.29),
   norm(eyeGap/(faceW||1),.20,.34),
   norm(jawW/(faceW||1),.46,.76),
   norm(mouthW/(faceW||1),.27,.47),
   norm(noseW/(faceW||1),.16,.27),
   norm(tilt,-.045,.045),
   norm(cheekW/(faceW||1),.55,.84)
 ];
}

function score(lm){
 const f=features(lm);
 let rows=animals.map(a=>{
   const d=Math.sqrt(f.reduce((s,v,i)=>s+(v-a.p[i])**2,0)/f.length);
   return {animal:a,sim:Math.exp(-2.2*d)};
 });
 const sum=rows.reduce((s,x)=>s+x.sim,0)||1;
 return rows.map(x=>({...x,pct:x.sim/sum*100})).sort((a,b)=>b.pct-a.pct);
}

function render(rows){
 const t=rows[0];
 $("animalIcon").textContent=t.animal.icon;
 $("resultName").textContent=t.animal.name;
 $("resultScore").textContent=`상대 점수 ${t.pct.toFixed(1)}%`;
 $("resultDesc").textContent=t.animal.d;
 $("bars").innerHTML=rows.map(x=>`<div class="bar-row"><div><b>${x.animal.icon} ${x.animal.name}</b></div><div class="track"><div class="fill" style="width:${Math.max(2,x.pct)}%"></div></div><div class="pct">${x.pct.toFixed(1)}%</div></div>`).join("");
 result.style.display="block";
 result.scrollIntoView({behavior:"smooth"});
}

analyze.onclick=async()=>{
 analyze.disabled=true;loader.style.display="block";latestResults=null;
 try{
   await faceMesh.send({image:preview});
   const lm=latestResults?.multiFaceLandmarks?.[0];
   if(!lm)throw new Error();
   render(score(lm));
   status.textContent="분석 완료!";
 }catch(e){
   status.textContent="얼굴을 인식하지 못했습니다. 밝은 정면 사진으로 다시 시도해 주세요.";
 }finally{
   loader.style.display="none";analyze.disabled=false;
 }
};

$("share").onclick=async()=>{
 const text=`나의 동물상 테스트 결과는 ${$("resultName").textContent}! ${$("resultScore").textContent}`;
 if(navigator.share){try{await navigator.share({title:"나의 동물상 테스트",text,url:location.href})}catch(e){}}
 else{await navigator.clipboard.writeText(text+"\n"+location.href);alert("결과와 주소를 복사했습니다.");}
};
})();
</script>
</body>
</html>
