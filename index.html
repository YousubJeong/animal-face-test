<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 동물상 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<style>
body{margin:0;background:#fff8f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:#222}
.wrap{max-width:760px;margin:auto;padding:28px 16px 56px}
.hero{text-align:center}.hero .emoji{font-size:46px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff0e8;color:#a45434;font-size:12px;font-weight:800}
.card{background:#fff;border-radius:24px;padding:22px;margin-top:18px;box-shadow:0 16px 48px rgba(90,55,30,.10)}
.drop{min-height:250px;border:2px dashed #edc5b0;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fffaf7}
.drop img{display:none;max-width:100%;max-height:440px;object-fit:contain}.placeholder{text-align:center;padding:28px}
input[type=file]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button,.file-label{border:0;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;flex:1;min-width:140px;text-align:center}
.primary,.file-label{background:linear-gradient(135deg,#ff8f66,#ffb36b);color:#fff}.secondary{background:#f5f1ed}
button:disabled{opacity:.5}.status{margin-top:13px;color:#666;font-size:14px}.loader{display:none;text-align:center;padding:12px}
#result{display:none;text-align:center}.animal-icon{font-size:72px}.result-name{font-size:30px;font-weight:900;margin:12px 0 5px}.result-score{color:#ff8f66;font-size:18px;font-weight:800}
.desc{line-height:1.75;color:#554a44}.bars{text-align:left;margin-top:22px}.bar-row{display:grid;grid-template-columns:92px 1fr 48px;gap:10px;align-items:center;margin:11px 0}
.track{height:10px;background:#f1ebe7;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff8f66,#ffb36b)}
.pct{text-align:right;font-size:13px}.notice{margin-top:18px;padding:14px;border-radius:14px;background:#faf5f1;font-size:13px;line-height:1.65}
@media(max-width:520px){.card{padding:17px}.bar-row{grid-template-columns:82px 1fr 44px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="emoji">🐶🐱🦊</div>
<h1>나의 동물상 테스트</h1>
<p>얼굴형과 눈매 등 여러 특징을 함께 비교해 재미용 동물상 결과를 보여드려요.</p>

</section>

<section class="card">
<div id="drop" class="drop">
<div id="placeholder" class="placeholder">📷<br><b>얼굴 사진을 선택해 주세요</b><br>정면 사진 · 한 명만 나온 사진이 가장 좋습니다.</div>
<img id="preview" alt="미리보기">
</div>
<input id="file" type="file" accept="image/*">
<div class="actions">
<label class="file-label" for="file">사진 선택하기</label>
<button id="analyze" class="primary" disabled>동물상 분석하기</button>
<button id="reset" class="secondary">다시 선택</button>
</div>
<div id="status" class="status">사진은 서버에 저장하지 않고 브라우저에서만 처리합니다.</div>
<div id="loader" class="loader">분석 중...</div>
</section>

<section id="result" class="card">
<div id="animalIcon" class="animal-icon">🐶</div>
<div id="resultName" class="result-name">강아지상</div>
<div id="resultScore" class="result-score">상대 점수 0%</div>
<p id="resultDesc" class="desc"></p>
<div id="bars" class="bars"></div>
<div class="actions">
<button id="share" class="primary">결과 공유하기</button>
<button id="again" class="secondary">다시 테스트</button>
</div>
<div class="notice">※ 오락용 테스트입니다. 성격·능력·건강 등을 판단하지 않습니다.</div>
</section>
</main>

<script>
(() => {
const $=id=>document.getElementById(id);
const file=$("file"),preview=$("preview"),placeholder=$("placeholder"),
      analyze=$("analyze"),result=$("result"),status=$("status"),loader=$("loader");
let objectUrl=null,latestResults=null;

/*
  V3 판정 특징 (총 11개)
  0 얼굴 가로/세로 비율
  1 눈 크기(가로)
  2 눈 사이 거리
  3 턱 폭
  4 입 폭
  5 코 폭
  6 눈꼬리 상승도
  7 볼/중안부 폭
  8 눈 세로 개방도
  9 눈 가로세로 비율(날렵함)
 10 얼굴 하관 길이 비율

  특히 6,8,9번을 이용해 강아지/고양이/여우 눈매를 더 강하게 분리.
*/
const animals=[
{
 name:"강아지상",icon:"🐶",
 p:[.60,.60,.52,.58,.48,.46,.40,.50,.72,.34,.48],
 w:[1.0,1.2,.7,.9,.5,.4,1.4,.6,1.6,1.4,.7],
 d:"부드럽고 친근한 인상이 두드러지는 타입이에요. 비교적 둥글고 열린 눈매와 편안한 얼굴선이 함께 반영됐어요."
},
{
 name:"고양이상",icon:"🐱",
 p:[.48,.50,.48,.42,.42,.42,.72,.46,.46,.66,.46],
 w:[.8,1.0,.6,.7,.4,.4,2.2,.5,1.6,2.0,.6],
 d:"또렷하고 세련된 인상이 두드러지는 타입이에요. 살짝 올라간 눈꼬리와 비교적 길고 선명한 눈매가 강조됐어요."
},
{
 name:"여우상",icon:"🦊",
 p:[.34,.43,.44,.32,.38,.40,.90,.36,.32,.84,.58],
 w:[1.3,.8,.5,1.0,.3,.3,2.8,.7,2.0,2.5,1.1],
 d:"날렵하고 선명한 인상이 두드러지는 타입이에요. 올라간 눈꼬리, 가늘고 긴 눈매, 비교적 긴 얼굴선이 강하게 반영됐어요."
},
{
 name:"토끼상",icon:"🐰",
 p:[.46,.78,.46,.44,.42,.40,.50,.42,.88,.24,.42],
 w:[.7,1.7,.7,.6,.3,.3,1.0,.4,2.0,1.6,.5],
 d:"밝고 생기 있는 인상이 두드러지는 타입이에요. 크고 세로로 열린 눈 영역이 상대적으로 강조됐어요."
},
{
 name:"곰상",icon:"🐻",
 p:[.82,.38,.50,.86,.58,.56,.34,.76,.52,.40,.48],
 w:[1.5,.6,.4,1.5,.7,.6,.8,1.0,.7,.8,.5],
 d:"편안하고 안정적인 인상이 두드러지는 타입이에요. 넓은 얼굴과 하관, 부드러운 눈매 비율이 함께 반영됐어요."
},
{
 name:"사슴상",icon:"🦌",
 p:[.32,.70,.56,.36,.36,.38,.48,.34,.78,.34,.66],
 w:[1.3,1.3,.8,.8,.3,.3,.9,.6,1.5,1.2,1.0],
 d:"차분하고 맑은 인상이 두드러지는 타입이에요. 비교적 긴 얼굴과 크고 맑게 열린 눈의 조합이 반영됐어요."
},
{
 name:"햄스터상",icon:"🐹",
 p:[.86,.66,.46,.70,.66,.58,.38,.82,.72,.30,.38],
 w:[1.5,1.1,.5,1.0,.9,.6,.7,1.2,1.1,1.0,.6],
 d:"둥글고 귀여운 인상이 두드러지는 타입이에요. 얼굴과 볼의 가로 폭, 둥글게 열린 눈매가 함께 반영됐어요."
}
];

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=(v,min,max)=>clamp((v-min)/(max-min));

// 얼굴 기울기(roll)를 보정하기 위해 두 점을 회전
function rotatePoint(p,c,ang){
 const x=p.x-c.x, y=p.y-c.y;
 const ca=Math.cos(ang), sa=Math.sin(ang);
 return {x:x*ca-y*sa+c.x, y:x*sa+y*ca+c.y};
}

file.addEventListener("change",e=>{
 const f=e.target.files[0]; if(!f)return;
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(f);
 preview.onload=()=>{
   preview.style.display="block";
   placeholder.style.display="none";
   analyze.disabled=false;
   result.style.display="none";
   status.textContent="사진이 준비됐습니다. ‘동물상 분석하기’를 눌러 주세요.";
 };
 preview.src=objectUrl;
});

function resetAll(){
 if(objectUrl)URL.revokeObjectURL(objectUrl);
 objectUrl=null;
 file.value="";
 preview.removeAttribute("src");
 preview.style.display="none";
 placeholder.style.display="block";
 analyze.disabled=true;
 result.style.display="none";
 status.textContent="사진은 서버에 저장하지 않고 브라우저에서만 처리합니다.";
}
$("reset").onclick=resetAll;
$("again").onclick=resetAll;

const faceMesh=new FaceMesh({
 locateFile:n=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${n}`
});
faceMesh.setOptions({
 maxNumFaces:1,
 refineLandmarks:true,
 minDetectionConfidence:.55,
 minTrackingConfidence:.55
});
faceMesh.onResults(r=>latestResults=r);

function features(lm){
 const top=lm[10], chin=lm[152], left=lm[234], right=lm[454];
 const faceH=dist(top,chin), faceW=dist(left,right);

 // 얼굴 roll 보정: 양 눈 중심을 잇는 선을 수평화
 const lCenter={x:(lm[33].x+lm[133].x)/2,y:(lm[33].y+lm[133].y)/2};
 const rCenter={x:(lm[362].x+lm[263].x)/2,y:(lm[362].y+lm[263].y)/2};
 const mid={x:(lCenter.x+rCenter.x)/2,y:(lCenter.y+rCenter.y)/2};
 const roll=Math.atan2(rCenter.y-lCenter.y,rCenter.x-lCenter.x);

 const rlm = idx => rotatePoint(lm[idx],mid,-roll);

 // 눈 가로 폭
 const leftEyeW=dist(rlm(33),rlm(133));
 const rightEyeW=dist(rlm(362),rlm(263));
 const eyeW=(leftEyeW+rightEyeW)/2;

 // 눈 세로 높이: 위/아래 눈꺼풀 대표점
 const leftEyeH=(dist(rlm(159),rlm(145))+dist(rlm(160),rlm(144)))/2;
 const rightEyeH=(dist(rlm(386),rlm(374))+dist(rlm(385),rlm(380)))/2;
 const eyeH=(leftEyeH+rightEyeH)/2;

 // 눈 사이 거리
 const eyeGap=dist(rlm(133),rlm(362));

 // 턱/입/코/볼
 const jawW=dist(rlm(172),rlm(397));
 const mouthW=dist(rlm(61),rlm(291));
 const noseW=dist(rlm(98),rlm(327));
 const cheekW=dist(rlm(50),rlm(280));

 // 눈꼬리 상승도
 // 좌측 눈: 바깥쪽 33 vs 안쪽 133
 // 우측 눈: 바깥쪽 263 vs 안쪽 362
 // 이미지 좌표는 아래쪽이 +y이므로 바깥 눈꼬리가 높을수록 양수가 되도록 계산
 const leOuter=rlm(33), leInner=rlm(133);
 const reOuter=rlm(263), reInner=rlm(362);
 const leftUp=(leInner.y-leOuter.y)/(faceH||1);
 const rightUp=(reInner.y-reOuter.y)/(faceH||1);
 const canthalUp=(leftUp+rightUp)/2;

 // 눈의 날렵함: 폭/높이. 값이 클수록 가늘고 긴 눈
 const eyeAspect=eyeW/(eyeH||0.0001);

 // 코 아래~턱 하관 길이를 전체 얼굴 높이에 대해 비교
 const lowerFace=dist(rlm(2),rlm(152))/(faceH||1);

 return [
   norm(faceW/(faceH||1),.66,.92),       // 0
   norm(eyeW/(faceW||1),.17,.29),        // 1
   norm(eyeGap/(faceW||1),.20,.34),      // 2
   norm(jawW/(faceW||1),.46,.78),        // 3
   norm(mouthW/(faceW||1),.27,.48),      // 4
   norm(noseW/(faceW||1),.16,.28),       // 5
   norm(canthalUp,-.018,.035),            // 6 눈꼬리 상승
   norm(cheekW/(faceW||1),.55,.86),      // 7
   norm(eyeH/(eyeW||1),.18,.42),         // 8 눈 세로 개방도
   norm(eyeAspect,2.5,5.6),               // 9 날렵함
   norm(lowerFace,.30,.48)                // 10 하관 길이
 ];
}

function score(lm){
 const f=features(lm);

 /*
   f[0] 얼굴 가로/세로(높을수록 둥글고 넓음)
   f[1] 눈 가로 크기
   f[2] 눈 사이 거리
   f[3] 턱 폭
   f[4] 입 폭
   f[5] 코 폭
   f[6] 눈꼬리 상승도
   f[7] 볼 폭
   f[8] 눈 세로 개방도
   f[9] 눈의 날렵함(가로/세로)
   f[10] 하관 길이
 */

 let rows=animals.map(a=>{
   let weighted=0, weightSum=0;
   for(let i=0;i<f.length;i++){
     const w=a.w[i];
     weighted += w*(f[i]-a.p[i])**2;
     weightSum += w;
   }

   const d=Math.sqrt(weighted/(weightSum||1));

   // 기본 유사도는 프로필 거리로 계산
   let logit = -2.75*d;

   const up=f[6];        // 눈꼬리 상승
   const open=f[8];      // 세로로 열린 정도
   const sharp=f[9];     // 가늘고 긴 정도
   const wideFace=f[0];  // 넓고 둥근 얼굴
   const jaw=f[3];       // 턱 폭
   const lower=f[10];    // 하관 길이
   const eyeSize=f[1];

   if(a.name==="여우상"){
     // 올라간 눈꼬리 + 가늘고 긴 눈 + 좁은 턱/긴 얼굴 조합을 강하게 반영
     logit += 1.15*Math.max(0, up-.48);
     logit += 1.05*Math.max(0, sharp-.46);
     logit += 0.55*Math.max(0, .60-jaw);
     logit += 0.45*Math.max(0, .58-wideFace);
     logit += 0.30*Math.max(0, lower-.48);

     // 눈이 매우 둥글고 크게 열린 경우 여우상 감점
     logit -= 0.70*Math.max(0, open-.72);
   }

   if(a.name==="고양이상"){
     // 고양이는 여우보다 약한 눈꼬리 상승 + 아몬드형 눈에 가점
     logit += 0.85*Math.max(0, up-.40);
     logit += 0.70*Math.max(0, sharp-.40);
     logit += 0.25*Math.max(0, .67-jaw);

     // 지나치게 둥근 눈에는 소폭 감점
     logit -= 0.35*Math.max(0, open-.80);
   }

   if(a.name==="강아지상"){
     // 둥글고 세로로 열린 눈, 완만한 눈꼬리
     logit += 0.80*Math.max(0, open-.54);
     logit += 0.35*Math.max(0, eyeSize-.50);
     logit += 0.25*Math.max(0, wideFace-.45);

     // 눈꼬리가 많이 올라가고 눈이 날렵하면 강아지상 감점
     logit -= 1.15*Math.max(0, up-.50);
     logit -= 0.90*Math.max(0, sharp-.52);
   }

   if(a.name==="토끼상"){
     // 크고 둥글게 열린 눈
     logit += 1.05*Math.max(0, open-.64);
     logit += 0.55*Math.max(0, eyeSize-.60);
     logit -= 0.50*Math.max(0, sharp-.66);
   }

   if(a.name==="사슴상"){
     // 큰 눈 + 긴 얼굴, 눈꼬리는 중립
     logit += 0.65*Math.max(0, open-.60);
     logit += 0.35*Math.max(0, lower-.50);
     logit += 0.25*Math.max(0, .55-wideFace);
   }

   if(a.name==="곰상"){
     // 넓은 얼굴과 턱이 실제로 함께 넓을 때만 가점
     logit += 0.85*Math.max(0, wideFace-.68);
     logit += 0.80*Math.max(0, jaw-.68);

     // 좁은 턱 또는 날렵한 눈매에는 감점
     logit -= 0.75*Math.max(0, .52-jaw);
     logit -= 0.55*Math.max(0, sharp-.60);
   }

   if(a.name==="햄스터상"){
     // 넓은 볼 + 둥근 눈 조합
     logit += 0.70*Math.max(0, wideFace-.70);
     logit += 0.55*Math.max(0, f[7]-.70);
     logit += 0.45*Math.max(0, open-.60);
   }

   return {animal:a,logit};
 });

 // softmax 안정화
 const maxLogit=Math.max(...rows.map(x=>x.logit));
 rows=rows.map(x=>({...x,sim:Math.exp((x.logit-maxLogit)*2.0)}));

 const sum=rows.reduce((s,x)=>s+x.sim,0)||1;

 return rows
   .map(x=>({...x,pct:x.sim/sum*100}))
   .sort((a,b)=>b.pct-a.pct);
}

function render(rows){
 const t=rows[0];
 $("animalIcon").textContent=t.animal.icon;
 $("resultName").textContent=t.animal.name;
 $("resultScore").textContent=`상대 점수 ${t.pct.toFixed(1)}%`;
 $("resultDesc").textContent=t.animal.d;

 $("bars").innerHTML=rows.map(x=>`
 <div class="bar-row">
   <div><b>${x.animal.icon} ${x.animal.name}</b></div>
   <div class="track"><div class="fill" style="width:${Math.max(2,x.pct).toFixed(1)}%"></div></div>
   <div class="pct">${x.pct.toFixed(1)}%</div>
 </div>`).join("");

 result.style.display="block";
 result.scrollIntoView({behavior:"smooth"});
}

analyze.onclick=async()=>{
 analyze.disabled=true;
 loader.style.display="block";
 latestResults=null;
 status.textContent="얼굴과 눈매 특징을 분석하고 있습니다.";

 try{
   await faceMesh.send({image:preview});
   const lm=latestResults?.multiFaceLandmarks?.[0];
   if(!lm)throw new Error("face_not_found");
   render(score(lm));
   status.textContent="분석 완료!";
 }catch(e){
   status.textContent="얼굴을 인식하지 못했습니다. 밝은 정면 사진으로 다시 시도해 주세요.";
 }finally{
   loader.style.display="none";
   analyze.disabled=false;
 }
};

$("share").onclick=async()=>{
 const text=`나의 동물상 테스트 결과는 ${$("resultName").textContent}! ${$("resultScore").textContent}`;
 if(navigator.share){
   try{await navigator.share({title:"나의 동물상 테스트",text,url:location.href})}catch(e){}
 }else{
   try{
     await navigator.clipboard.writeText(text+"
"+location.href);
     alert("결과와 주소를 복사했습니다.");
   }catch(e){}
 }
};
})();
</script>
</body>
</html>
